<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約服務項目 | 原彤Skin</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #7a6f8a;
            --bg-color: #fdfbfd;
            --card-bg: #ffffff;
            --text-color: #444;
            --border-color: #eee;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            padding-bottom: 100px; /* 預留底部按鈕空間 */
        }

        /* 標題區 */
        .step-header {
            text-align: center;
            padding: 30px 20px 10px;
        }
        .step-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-purple);
            margin-bottom: 5px;
        }

        /* 選項容器 */
        .options-container {
            padding: 10px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 單個選項卡片 */
        .service-option {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }

        /* 點擊時的效果 */
        .service-option:active {
            transform: scale(0.98);
        }

        /* 隱藏預設 checkbox，改用自訂樣式 */
        .service-option input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            accent-color: var(--primary-purple);
            cursor: pointer;
        }

        /* 選項文字區塊 */
        .option-content {
            flex: 1;
        }

        .option-title {
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .option-desc {
            font-size: 0.85rem;
            color: #888;
        }

        /* --- 特價標籤樣式 (重點) --- */
        .sale-tag {
            background-color: #ff4d4f; /* 亮紅色 */
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: normal;
            display: inline-block;
        }

        /* 底部按鈕區 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            padding: 15px 20px;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            z-index: 100;
        }

        /* 底部導覽按鈕 */
        .nav-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        .btn-next {
            flex: 1;
            background-color: var(--primary-purple);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(122, 111, 138, 0.4);
        }
        
        .btn-back {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #f0f0f0;
            color: #666;
            text-decoration: none;
            font-size: 1.2rem;
        }

    </style>
</head>
<body>

    <div class="step-header">
        <div class="step-title">第一步：選擇主要服務項目</div>
    </div>

    <form id="bookingForm" class="options-container">
        
        <label class="service-option">
            <input type="checkbox" name="service" value="霧唇" data-price="7980">
            <div class="option-content">
                <div class="option-title">
                    霧唇 | 唇色還原 
                    <span class="sale-tag">特價</span>
                </div>
                <div class="option-desc">NT$ 7,980 / 200分鐘</div>
            </div>
        </label>

        <label class="service-option">
            <input type="checkbox" name="service" value="唇淨淡色" data-price="3490">
            <div class="option-content">
                <div class="option-title">
                    唇淨淡色 | 改烏唇
                    <span class="sale-tag">特價</span>
                </div>
                <div class="option-desc">NT$ 3,490 / 90分鐘</div>
            </div>
        </label>

        <label class="service-option">
            <input type="checkbox" name="service" value="唇氧" data-price="1800">
            <div class="option-content">
                <div class="option-title">唇氧 | 導入保濕</div>
                <div class="option-desc">NT$ 1,800 / 60分鐘</div>
            </div>
        </label>

        <label class="service-option">
            <input type="checkbox" name="service" value="小氣泡深層清潔" data-price="1200">
            <div class="option-content">
                <div class="option-title">小氣泡深層清潔</div>
                <div class="option-desc">NT$ 1,200 / 60分鐘</div>
            </div>
        </label>

        <label class="service-option">
            <input type="checkbox" name="service" value="水氧活膚" data-price="1500">
            <div class="option-content">
                <div class="option-title">水氧活膚</div>
                <div class="option-desc">NT$ 1,500 / 60分鐘</div>
            </div>
        </label>

    </form>

    <div class="bottom-bar">
        <div class="nav-buttons">
            <a href="index.html" class="btn-back">
                &lt; </a>
            
            <button class="btn-next" onclick="goToNextStep()">
                下一步：選擇預約時間
            </button>
        </div>
    </div>

    <script>
        // 簡單的腳本：按下按鈕時檢查有沒有選項目
        function goToNextStep() {
            // 取得所有被勾選的項目
            const checkboxes = document.querySelectorAll('input[name="service"]:checked');
            
            if (checkboxes.length === 0) {
                alert("請至少選擇一個服務項目喔！");
                return;
            }

            let selectedServices = [];
            checkboxes.forEach((cb) => {
                selectedServices.push(cb.value);
            });

            // 這裡您可以設定要跳轉去哪裡，例如：
            // location.href = "date_selection.html"; 
            
            // 目前先跳出提示
            alert("您選擇了：" + selectedServices.join(", ") + "\n\n(這裡可以連結到您的日期選擇頁面)");
        }
    </script>

</body>
</html>
